# Loki, single binary on the local filesystem. RETENTION IS THE COMPACTOR'S JOB: retention_period
# alone deletes nothing unless compactor.retention_enabled is on.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 72h
  max_query_lookback: 72h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  allow_structured_metadata: true
  # What Grafana's Logs Drilldown reads: log volume per label, and the patterns below.
  volume_enabled: true

# Groups similar lines into patterns, which is most of what "analyse the logs" means here.
pattern_ingester:
  enabled: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 1h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
