# Tempo 3, single binary (-target=all), local storage. Spans arrive from Soma over OTLP gRPC.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# RETENTION. In Tempo 3 the backend worker runs compaction and retention.
backend_worker:
  compaction:
    block_retention: 24h

usage_report:
  reporting_enabled: false
