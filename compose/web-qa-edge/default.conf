# THE QA STACK'S ONLY FOOT ON PRODUCTION'S NETWORK, and it does nothing but forward.
#
# WHY IT EXISTS. web's nginx proxies /v1 to the literal name `soma`, resolved PER REQUEST through
# Docker's embedded DNS (its config uses `resolver 127.0.0.11` with a variable upstream, so the
# address is not fixed at startup and /etc/hosts is never consulted). Production's Soma service is
# also called `soma`. So a QA web container attached to BOTH networks resolves `soma` to whichever
# of the two Docker answers with -- and on this machine it answered with PRODUCTION'S, which made
# QA's site a second front end onto the live ladder.
#
# The fix is that the container running web's image is on QA's network ALONE, where `soma` has one
# meaning. Production's caddy still needs a name it can reach, so this forwards to it: `web-site`
# exists only on QA's network, so THIS container's two networks cannot make it ambiguous.
#
# It keeps the name `web-qa` on the edge network, so production's caddy configuration is unchanged.
server {
    listen 80;
    server_name _;

    # Same resolver, same reason -- but for a name production's network does not have.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site http://web-site:80;

    # Its own health, answered without reaching the site behind it.
    location = /_edge_health { access_log off; return 200 "ok\n"; }

    location / {
        proxy_pass         $site;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # APPENDED, not replaced: caddy put the browser's address here and Soma reads the chain
        # right to left past the addresses in SOMA_TRUSTED_PROXIES, which covers both subnets.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
    }
}
