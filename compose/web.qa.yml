# A QA PLATFORM BESIDE PRODUCTION, on the same machine. The candidate release, with production's
# data restored into databases of its own, for a few named developers to use.
#
#   cp examples/web.qa.env.example qa/web/.env          # README, *A QA stack beside production*, says how
#   scripts/setup/qa-secrets.sh                         # the five secrets, one of them copied from production
#   scripts/setup/qa-db.sh                              # soma_qa + orion_state_qa on the production server
#   TB_ENV=qa scripts/setup/sign-plugins.sh prod/web/keys/tinybrains-dev.pem
#   scripts/setup/qa-refresh.sh --yes --up              # production's rows, migrated, then up
#
# WHAT IT SHARES WITH PRODUCTION, and why each one is safe to share:
#
#   the VM          two compose projects, no published ports here at all
#   Postgres        the same server, two databases of its own. The gate role is cluster-wide and
#                   its password is therefore production's -- see qa-db.sh, which enforces that.
#   caddy           production's, through compose/caddy/conf.d/qa.caddy: this file publishes
#                   nothing, and `web-qa` is reachable on production's network by that name.
#   the trust key   keys/tinybrains-dev.pem, one root per machine. The SIGNATURES are not shared:
#                   QA's images carry a different engine, and one keys/signatures/ holding two
#                   digests under `tb-ants.wasm.sig` is what sign-plugins.sh refuses by name.
#
# WHAT IT MUST NOT SHARE, each one a production outage if it does:
#
#   Redis           Soma's clocks are Orion CLUSTER singletons and [cluster] redis_url has no key
#                   prefix. One Redis for both stacks elects ONE pair clock, ONE count clock,
#                   across four nodes -- production's ladder goes quietly idle and looks settled.
#                   Two containers, ~10 MB each. Never point this at production's.
#   the buckets     a QA runner writes replays and reads models by digest; on production's buckets
#                   the object it overwrites is a competitor's.
#   the databases   soma_qa and orion_state_qa, never a schema inside production's. The migrations
#                   are unqualified against `public` and bootstrap records its digest in
#                   public.soma_schema -- a search_path split would be a schema rewrite.
#   the OAuth App   the callback is per-host, and QA's admin list is the guest list.
#
# WHAT DIFFERS FROM compose/web.prod.yml, beyond the names: no caddy and no ports, `web-qa`
# instead of `web` (a service named `web` on production's network would make Docker's DNS
# round-robin production's browsers between the two stacks), the console on 9443, and the sizing in
# qa/web/.env rather than passed through empty -- QA's numbers are chosen, not defaulted.
#
# TEARDOWN IS FOUR COMMANDS, and nothing QA-only lives inside a production resource:
#   ./tb qa web down -v
#   scripts/setup/qa-db.sh --drop
#   rm compose/caddy/conf.d/qa.caddy && ./tb prod web up -d caddy
#   ...then delete the two R2 buckets, the R2 token, the OAuth App and the DNS record.

name: tinybrains-qa

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-orion-logging: &orion-logging
  ORION_LOGGING__FORMAT: json
  RUST_LOG: ${ORION_RUST_LOG:-info,dataflow_rs::engine::workflow_executor=warn,dataflow_rs::engine::functions::filter=warn,orion::server::observability=warn}

x-trust: &trust
  TB_TRUST_PUBLIC_KEY: ${TB_TRUST_PUBLIC_KEY:?scripts/setup/qa-secrets.sh writes it, shared with production}
  ORION_ADMIN_KEY: ${ORION_ADMIN_KEY:?scripts/setup/qa-secrets.sh writes it}

# ONE ENDPOINT, FOUR NAMES, as in production -- but QA'S BUCKETS. The endpoint is the account's and
# is the same string production uses; the bucket names are what separate the two stacks' objects.
x-object-store: &object-store
  MODELS_BUCKET: ${MODELS_BUCKET:?QA's own models bucket, NOT production's}
  MODELS_ENDPOINT: ${R2_S3_ENDPOINT:?https://<account-id>.r2.cloudflarestorage.com}
  MODELS_PUBLIC_ENDPOINT: ${R2_S3_ENDPOINT}
  R2_ENDPOINT: ${R2_S3_ENDPOINT}
  RUNNER_BLOB_ENDPOINT: ${R2_S3_ENDPOINT}
  R2_BUCKET: ${R2_BUCKET:?QA's own replays bucket, NOT production's}
  R2_ACCESS_KEY: ${R2_ACCESS_KEY:?an R2 token scoped to the two -qa buckets and nothing else}
  R2_SECRET_KEY: ${R2_SECRET_KEY:?an R2 token scoped to the two -qa buckets and nothing else}

# CHOSEN, NOT DEFAULTED. Production passes these through empty so the image's defaults hold; QA sets
# them, because the whole reason QA fits on this machine is that its pools and its heap are smaller.
# qa/web/.env explains the 12-connection budget.
x-node-sizing: &node-sizing
  SOMA_DB_MAX_CONNECTIONS: ${SOMA_DB_MAX_CONNECTIONS:-4}
  SOMA_GATE_DB_MAX_CONNECTIONS: ${SOMA_GATE_DB_MAX_CONNECTIONS:-2}
  SOMA_STATE_DB_MAX_CONNECTIONS: ${SOMA_STATE_DB_MAX_CONNECTIONS:-6}
  SOMA_STATE_DB_MIN_CONNECTIONS: ${SOMA_STATE_DB_MIN_CONNECTIONS:-1}
  SOMA_DB_CONNECT_TIMEOUT_MS: ${SOMA_DB_CONNECT_TIMEOUT_MS:-}
  SOMA_GATE_DB_CONNECT_TIMEOUT_MS: ${SOMA_GATE_DB_CONNECT_TIMEOUT_MS:-}
  SOMA_STATE_DB_ACQUIRE_TIMEOUT_SECS: ${SOMA_STATE_DB_ACQUIRE_TIMEOUT_SECS:-}
  SOMA_CRON_WORKERS: ${SOMA_CRON_WORKERS:-}
  SOMA_HOT_CACHE_TTL_SECS: ${SOMA_HOT_CACHE_TTL_SECS:-}
  SOMA_SEASON_CACHE_TTL_SECS: ${SOMA_SEASON_CACHE_TTL_SECS:-}
  SOMA_RATE_PUBLIC_RPS: ${SOMA_RATE_PUBLIC_RPS:-}
  SOMA_RATE_PUBLIC_BURST: ${SOMA_RATE_PUBLIC_BURST:-}
  SOMA_RATE_SESSION_RPS: ${SOMA_RATE_SESSION_RPS:-}
  SOMA_RATE_SESSION_BURST: ${SOMA_RATE_SESSION_BURST:-}
  SOMA_RATE_PER_USER_READ_RPS: ${SOMA_RATE_PER_USER_READ_RPS:-}
  SOMA_RATE_PER_USER_READ_BURST: ${SOMA_RATE_PER_USER_READ_BURST:-}
  SOMA_RATE_PER_USER_WRITE_RPS: ${SOMA_RATE_PER_USER_WRITE_RPS:-}
  SOMA_RATE_PER_USER_WRITE_BURST: ${SOMA_RATE_PER_USER_WRITE_BURST:-}
  SOMA_RATE_PER_ADMIN_BOARD_RPS: ${SOMA_RATE_PER_ADMIN_BOARD_RPS:-}
  SOMA_RATE_PER_ADMIN_BOARD_BURST: ${SOMA_RATE_PER_ADMIN_BOARD_BURST:-}
  SOMA_RATE_RUNNER_RPS: ${SOMA_RATE_RUNNER_RPS:-}
  SOMA_RATE_RUNNER_BURST: ${SOMA_RATE_RUNNER_BURST:-}
  SOMA_RATE_RUNNER_TOKEN_RPS: ${SOMA_RATE_RUNNER_TOKEN_RPS:-}
  SOMA_RATE_RUNNER_TOKEN_BURST: ${SOMA_RATE_RUNNER_TOKEN_BURST:-}
  SOMA_RATE_PER_RUNNER_RPS: ${SOMA_RATE_PER_RUNNER_RPS:-}
  SOMA_RATE_PER_RUNNER_BURST: ${SOMA_RATE_PER_RUNNER_BURST:-}
  SOMA_RATE_SIGNIN_RPS: ${SOMA_RATE_SIGNIN_RPS:-}
  SOMA_RATE_SIGNIN_BURST: ${SOMA_RATE_SIGNIN_BURST:-}

x-soma: &soma-image
  image: "${SOMA_IMAGE:?name the candidate, ghcr.io/tiny-brains/soma:<version>}"

services:
  # QA'S OWN cluster state. Never production's: see the header.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    logging: *logging
    networks: [platform]

  cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "${CACHE_MAXMEMORY:-64mb}", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    logging: *logging
    networks: [platform]

  # BOTH DATABASES MUST ALREADY EXIST -- scripts/setup/qa-db.sh makes them. Bootstrap creates only
  # the literal `orion_state`, which production owns, so its create step is a no-op here and the
  # migrate step would fail into a database that was never made.
  #
  # AND IT WILL RESET THE runner_gate PASSWORD FOR THE WHOLE SERVER. The role is cluster-wide;
  # `ALTER ROLE runner_gate WITH LOGIN PASSWORD` runs on every bring-up. qa-db.sh refuses to
  # proceed unless qa/web/.env's value matches prod/web/.env's, which is why that check is a precondition of
  # this service rather than a line in a README.
  soma-bootstrap:
    <<: *soma-image
    command: ["bootstrap"]
    environment:
      SOMA_DB_URL: ${SOMA_DB_URL:?soma_qa as its owner, ?sslmode=require}
      SOMA_ADMIN_DB_URL: ${SOMA_ADMIN_DB_URL:?the maintenance database on the same server}
      RUNNER_GATE_DB_PASSWORD: ${RUNNER_GATE_DB_PASSWORD:?must EQUAL production's -- the role is cluster-wide}
      ENGINE_RELEASE: ${ENGINE_RELEASE:-0}
    restart: "no"
    logging: *logging
    networks: [platform]

  soma:
    <<: *soma-image
    init: true
    depends_on:
      soma-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      # QA'S OWN signatures, because QA's images carry the candidate's engine:
      #   TB_ENV=qa scripts/setup/sign-plugins.sh prod/web/keys/tinybrains-dev.pem
      - ${SIG_DIR:-../qa/web/keys/signatures}:/sig:ro
    environment:
      <<: [*trust, *object-store, *orion-logging, *node-sizing]
      ORION_ENVIRONMENT: production
      ORION_CORS__ALLOWED_ORIGINS: https://${QA_HOST:?the QA hostname, e.g. qa.tinybrains.dev}
      ORION_ADMIN_AUTH__ENABLED: "true"
      ORION_ADMIN_AUTH__API_KEYS: ${ORION_ADMIN_KEY}
      # Distinct from production's `soma-1`. Both nodes' ids are recorded in their own state
      # databases, so this is for reading a log, not for correctness.
      ORION_INSTANCE_ID: ${SOMA_INSTANCE_ID:-soma-qa-1}

      ORION_STATE_DB_URL: ${ORION_STATE_DB_URL:?orion_state_qa on the same server}
      SOMA_DB_URL: ${SOMA_DB_URL}
      RUNNER_GATE_DB_URL: ${RUNNER_GATE_DB_URL:?soma_qa as runner_gate, with the SHARED password}
      # QA's own Redis, on QA's own network. `redis` here is tinybrains-qa's redis, not production's.
      REDIS_URL: redis://redis:6379
      SOMA_CACHE_URL: redis://cache:6379/0
      GITHUB_USERINFO_URL: ${GITHUB_USERINFO_URL:-https://api.github.com/user}
      SOMA_AUTH_PROVIDERS: ${SOMA_AUTH_PROVIDERS:-}
      PLUGIN_SIG_DIR: /sig

      SOMA_ALLOW_PRIVATE_URLS: ${SOMA_ALLOW_PRIVATE_URLS:-false}

      APP_URL: https://${QA_HOST}/
      OAUTH_REDIRECT_URI: https://${QA_HOST}/v1/auth/{provider}/callback
      # 9443, not production's 8443: one caddy publishes both, so the console ports cannot collide.
      CONSOLE_URL: https://${QA_HOST}:9443
      SOMA_COOKIE_SECURE: "1"
      SOMA_SESSION_SECRET: ${SOMA_SESSION_SECRET:?scripts/setup/qa-secrets.sh writes it}
      RUNNER_TOKEN_SECRET: ${RUNNER_TOKEN_SECRET:?scripts/setup/qa-secrets.sh writes it}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?the QA GitHub OAuth App, not production's}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?the QA GitHub OAuth App, not production's}
      SOMA_ADMIN_IDS: ${SOMA_ADMIN_IDS:?the developers you are letting onto QA}

      # BOTH SUBNETS. A browser reaches QA as caddy -> web-qa -> soma: caddy is on production's
      # network and appends its address there, web-qa dials soma from QA's. Trusting only one leaves
      # Orion reading a proxy's address as the client's, which is every rate limit in one bucket.
      SOMA_TRUSTED_PROXIES: '["${QA_SUBNET:-172.29.251.0/24}", "${PLATFORM_SUBNET:-172.29.250.0/24}"]'
      ORION_SHUTDOWN_DRAIN_SECS: ${SOMA_SHUTDOWN_DRAIN_SECS:-30}
      ORION_SHUTDOWN_FORCE_SECS: ${SOMA_SHUTDOWN_FORCE_SECS:-30}
      ORION_CRON_SHUTDOWN_SECS: ${SOMA_CRON_SHUTDOWN_SECS:-60}
    stop_grace_period: ${SOMA_STOP_GRACE:-90s}
    restart: unless-stopped
    logging: *logging
    networks: [platform]
    deploy:
      resources:
        limits:
          memory: ${SOMA_MEMORY:-512m}

  # QA's console, behind QA's sign-in, on 9443.
  #   ./tb qa web --profile console up -d
  orion-ui-qa:
    image: ghcr.io/goplasmatic/orion-ui:${ORION_UI_VERSION:-1.9.1}
    profiles: [console]
    depends_on:
      soma:
        condition: service_healthy
    environment:
      ORION_URL: http://soma:8080
      ORION_AUTHZ_URL: http://soma:8080
      ORION_SIGNIN_URL: https://${QA_HOST}/v1/auth/github
      ORION_CONSOLE_URL: https://${QA_HOST}:9443
      ORION_ADMIN_KEY: ${ORION_ADMIN_KEY}
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_FILTER: "ORION|NGINX_LOCAL_RESOLVERS"
    volumes:
      - ./orion-ui/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped
    logging: *logging
    # Both, so production's caddy can reach it by name on 9443.
    networks: [platform, edge]

  # NAMED `web-qa`, AND THAT NAME IS LOAD-BEARING. Compose gives every service its own name as a DNS
  # alias on each network it joins, so a service called `web` here would answer to `web` on
  # production's network too -- and Docker's embedded DNS would round-robin production's browsers
  # between the two stacks. It has happened on this platform before, with a rehearsal `soma`.
  #
  # Its nginx proxies /v1 to `soma:8080`, resolved on QA's own network: the baked nginx.conf hard-codes
  # that name, which is why QA's Soma service is `soma` and stays OFF the shared network.
  web-qa:
    image: "${WEB_IMAGE:?name the candidate, ghcr.io/tiny-brains/web:<version>}"
    depends_on:
      soma:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    networks: [platform, edge]

# NO caddy AND NO PORTS. Production's caddy is the only thing on 80/443 on this machine; it serves
# QA_HOST from compose/caddy/conf.d/qa.caddy, reaching `web-qa` across the network below.
networks:
  platform:
    ipam:
      config:
        - subnet: ${QA_SUBNET:-172.29.251.0/24}
  # Production's network, joined rather than created. `external` means compose will not make it:
  # if this name is wrong the QA stack refuses to start, which is the right failure -- the wrong
  # one would be a second network that caddy cannot see and a QA host that 502s.
  edge:
    external: true
    name: ${PROD_NETWORK:-tinybrains-prod_platform}
