# THE ARCHITECTURE DIAGRAMS, PUBLISHED. diagrams/ is a static site: index.html and three archify
# pages, each generated from its source in diagrams/src/ and dressed in the TinyBrains design system,
# and committed as generated. Nothing here builds them -- a change is an edit to a source and a
# rebuild, from devops/:
#
#   node scripts/diagrams/build.mjs     # archify's every gate, then the tokens and logo from Tiny-Brains/web
#
# Published from main by this workflow, not from a branch: every repository commits to main only.

name: pages

on:
  push:
    branches: [main]
    paths: [diagrams/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: diagrams
      - id: deployment
        uses: actions/deploy-pages@v4
