# tinybrains -- one binary that plays a wave on a laptop. It loads a cartridge component through
# wasmtime, evaluates adapters and ONNX graphs through axon as a library, and writes the same
# replay envelope Kalam writes -- none of them re-implementations.
#
# IT KNOWS NO GAME: five function names, `cartridge.json`, and the replay envelope. No Ants types,
# no engine crate. Adding a second game is an entry in devops/games/registry.toml and no Rust.

[package]
name = "tinybrains"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "tinybrains"
path = "src/main.rs"

[dependencies]
# Matching what orion-server runs, so the component is executed here by the same runtime that
# executes it in production.
wasmtime = { version = "48", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }

# The evaluator as a library rather than over HTTP. A path dependency while the repositories are
# siblings; `tinybrains games` prints the evaluator digest it was built against, so a stale pin is
# visible rather than silent.
axon = { path = "../../axon" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
dirs = "5"

[profile.release]
opt-level = 2
