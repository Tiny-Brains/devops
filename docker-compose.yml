# TinyBrains local stack: one Orion, one loader, and the processes that are not Orion.
#
# This directory is THE DEPLOYMENT SURFACE, and that is the whole point of it. soma/, jodi/ and
# kalam/ are separate repos that each ship a self-contained Orion package and know nothing about
# the topology; this file decides how many servers there are and which package goes in which. A
# modular monolith: modular in the repos, and as monolithic in deployment as it is useful to be.
#
# Locally that is ONE orion-server holding all three packages -- Soma's REST surface, Jodi's four
# clocks and Kalam's wave -- installed by ONE one-shot `loader`, plus the parts that are not Orion:
# Postgres, the two roles of the Model Loader, the replay store, and the web shell. The day Soma's
# REST surface needs to scale independently of the wave, Kalam gets a service here with its own
# config and its section of orion/orion.toml.tmpl moves with it; neither repo changes.
#
# THE TWO AXONS SHARE ONE STORE, and that is a correctness property rather than a saving. The
# admission instance mirrors what it verified under the bytes' hash; the replica fetches by that
# hash. Two stores would mean admission succeeds and every match the version is then paired for
# fails at the residency barrier -- quietly, and a long way from the cause. They are two processes
# rather than one because the binary refuses to be both: a replica's fetch allowlist is empty
# whatever the environment says, and admission answers /play with a 404, so a confusion of roles
# is loud.
#
# THE ONE NUMBER THREE THINGS MUST AGREE ON is the engine digest: the plugin Orion loads (keyed by
# sha256 over the component), `[vars] engine_digest` the claim filters on, and
# `games.active_engine_digest` that pair stamps on every row. A mismatch is not an error anywhere
# -- the wave just claims nothing, for ever. So nobody types it: `orion`'s entrypoint and the
# `loader` both derive it from kalam/plugins/tb-ants/tb-ants.wasm.
#
#   cd devops
#   cp .env.example .env     # then fill in the blanks
#   docker compose up --build
#   open http://localhost:5173
#
# After editing a package:  docker compose run --rm loader
#
# The web container serves the built SPA and proxies /v1 to orion, so the browser only ever sees
# one origin. That is what lets Soma's HttpOnly session cookie work and is why the port is
# published as 5173 -- it keeps the OAuth callback URL registered with GitHub identical to the one
# `npm run dev` uses.

name: tinybrains

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-soma}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Run once, on first initialisation of the volume, in filename order: create Orion's state
      # database, apply Soma's schema, seed the one game and its baselines. Re-running them means
      # `docker compose down -v` first. Everything a database needs AFTER that -- the kalam role's
      # password, the engine digest, the cartridge manifest -- is the loader's, and idempotent.
      - ./db-init/10-orion-state.sh:/docker-entrypoint-initdb.d/10-orion-state.sh:ro
      - ../soma/migrations/0001_init.sql:/docker-entrypoint-initdb.d/20-soma-schema.sql:ro
      - ../soma/migrations/0002_sessions.sql:/docker-entrypoint-initdb.d/25-soma-sessions.sql:ro
      - ./db-init/30-seed.sql:/docker-entrypoint-initdb.d/30-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soma} -d ${POSTGRES_DB:-soma}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    # Not published by default -- nothing outside the compose network needs it.
    # Uncomment to run psql from the host.
    # ports:
    #   - "5432:5432"

  # --------------------------------------------------------------------------- the one Orion
  #
  # orion-server 1.7.0 and nothing else: the packages are installed by `loader`, the config is
  # mounted. The environment is everything the three packages read at run time -- each connector
  # names its own credential as env://, resolved by the server, so the loader never sees a secret.
  orion:
    build:
      context: ./orion
      args:
        ORION_VERSION: ${ORION_VERSION:-1.7.0}
    volumes:
      - ./orion/orion.toml.tmpl:/etc/orion/orion.toml.tmpl:ro
      # Only for the engine digest, derived from plugins/tb-ants/tb-ants.wasm at boot.
      - ../kalam:/pkg/kalam:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORION_STATE_DB_URL: postgres://${POSTGRES_USER:-soma}:${POSTGRES_PASSWORD}@db:5432/orion_state

      # Three connectors, three credentials. Soma and Jodi share the owner role for now -- Jodi
      # writes most of the schema, and a dedicated `jodi` role with exactly those grants is worth
      # doing the way `kalam` was. Kalam's role can SELECT matches and match_seats and UPDATE only
      # its own columns; design/v2/01-verify/run.sh proves Postgres refuses it everything else.
      SOMA_DB_URL: postgres://${POSTGRES_USER:-soma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-soma}
      JODI_DB_URL: postgres://${POSTGRES_USER:-soma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-soma}
      KALAM_DB_URL: postgres://kalam:${KALAM_DB_PASSWORD:-kalam-dev-secret}@db:5432/${POSTGRES_DB:-soma}

      # HS256 key for the session tokens and for the sign-in channel's state cookie. Rotating it
      # invalidates every live session and every sign-in in flight. At least 32 bytes.
      SOMA_SESSION_SECRET: ${SOMA_SESSION_SECRET:?set SOMA_SESSION_SECRET in .env}

      # From the GitHub OAuth App, read as env:// by the sign-in channel; the secret never
      # appears in a trace or a response.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}

      # Must match the OAuth App's Authorization callback URL exactly, and must be an address the
      # *browser* can reach -- it is where GitHub sends the user back, not a container name.
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:5173/v1/auth/github/callback}
      APP_URL: ${APP_URL:-http://localhost:5173/}

      # DEVELOPMENT ONLY. The stack is served over plain http, and browsers will not store a
      # Secure cookie from an http:// origin -- which breaks sign-in in a way that looks like
      # nothing happened. Set to 1 (or drop it) the moment the app is behind TLS.
      SOMA_COOKIE_SECURE: "${SOMA_COOKIE_SECURE:-0}"

      # The base admission builds a release's two asset URLs on (layer 08 §5, decision 17).
      RELEASE_BASE: ${RELEASE_BASE:-https://github.com/}

      # The replay store, read by soma-blobs (presigned GET) and kalam-blobs (presigned PUT), and
      # by [vars] blob_endpoint. Locally the minio service; in a deployment, R2.
      R2_ENDPOINT: ${R2_ENDPOINT:-http://minio:9000}
      R2_BUCKET: ${R2_BUCKET:-tinybrains-replays}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-tinybrains}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-tinybrains-dev-secret}

      # Optional. Pins the engine instead of deriving it; the loader refuses a pin that disagrees
      # with the file. And the drain -- see the note in orion/orion.toml.tmpl.
      KALAM_ENGINE_DIGEST: ${KALAM_ENGINE_DIGEST:-}
      ORION_SHUTDOWN_DRAIN_SECS: ${ORION_SHUTDOWN_DRAIN_SECS:-5}
      ORION_SHUTDOWN_FORCE_SECS: ${ORION_SHUTDOWN_FORCE_SECS:-10}
      ORION_CRON_SHUTDOWN_SECS: ${ORION_CRON_SHUTDOWN_SECS:-15}
    # Must exceed every shutdown number in the config, or compose SIGKILLs the drain.
    stop_grace_period: ${ORION_STOP_GRACE:-20s}
    restart: unless-stopped
    # Published so you can curl the API and reach the admin plane directly. The admin API is
    # unauthenticated by default -- do not expose this port anywhere but a development machine.
    ports:
      - "127.0.0.1:8080:8080"

  # --------------------------------------------------------------------------- the one loader
  #
  # One-shot. Declares the deployment facts in the database, makes the replay bucket, and installs
  # soma, jodi and kalam into `orion` by running each repo's own scripts/load-package.sh. Orion
  # holds definitions in its state database, so loading is something you do TO a server, not
  # something that runs beside it: `restart: "no"`, exit 0. Re-run it after any package edit --
  # `docker compose run --rm loader` -- and it sweeps each package by its tag and re-creates it.
  #
  # What each load script wants from the environment is listed at the top of that script. The
  # three ALLOW_PRIVATE flags exist because compose service names resolve to private addresses,
  # which Orion's SSRF guard refuses unless the connector opts in, and the committed packages do
  # not ship with the guard disabled.
  loader:
    build:
      context: ./loader
    depends_on:
      orion:
        condition: service_healthy
      # The wave claims matches it cannot play if its loader is absent, and each one costs a lease
      # and two lapses -- so the package is not installed until both axons answer.
      axon:
        condition: service_healthy
      axon-admission:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../soma:/pkg/soma:ro
      - ../jodi:/pkg/jodi:ro
      - ../kalam:/pkg/kalam:ro
      # The cartridge repo, for reference/observations.json once it publishes one; until then the
      # one worst-case observation axon's tests use stands in (design/v2/08-admission.md).
      - ../ants:/pkg/ants:ro
      - ../axon/tests/fixtures/ants-observation.json:/pkg/reference/ants-observation.json:ro
    environment:
      ORION_ADMIN: http://orion:8080/api/v1/admin
      # 1 declares the vendored engine as a rules change, which is refused while a season is live (06 §5.3)
      ENGINE_RELEASE: ${ENGINE_RELEASE:-0}
      LOADER_DB_URL: postgres://${POSTGRES_USER:-soma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-soma}
      KALAM_DB_PASSWORD: ${KALAM_DB_PASSWORD:-kalam-dev-secret}
      KALAM_ENGINE_DIGEST: ${KALAM_ENGINE_DIGEST:-}
      # soma
      SOMA_ALLOW_PRIVATE_DB: "1"
      # jodi -- its admission clock reaches the admission axon through the `jodi-loader` connector.
      JODI_ALLOW_PRIVATE_DB: "1"
      ADMISSION_LOADER_URL: http://axon-admission:9090
      # kalam -- its wave reaches the replica axon through `model-loader`, and the store through
      # `kalam-blobs-put`, whose base URL must be exactly the endpoint.
      KALAM_ALLOW_PRIVATE_URLS: "1"
      MODEL_LOADER_URL: http://axon:9090
      R2_ENDPOINT: ${R2_ENDPOINT:-http://minio:9000}
      R2_BUCKET: ${R2_BUCKET:-tinybrains-replays}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-tinybrains}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-tinybrains-dev-secret}
    restart: "no"

  # Orion's own operations console: live dashboards, a system map of the channels and connectors,
  # workflow DAGs, and trace drill-downs. It reads the same admin API the loader writes to, so it
  # is also the easiest way to see why a channel is quarantined. 1.6.0 is the newest console
  # published and reads a 1.7.0 server fine.
  #
  # SECURITY: the admin API is unauthenticated by default, so anyone who can reach this console
  # can create, edit and delete channels and workflows, and fire arbitrary requests at them. It
  # is published on 127.0.0.1 only. Do not bind it to a routable address without admin_auth.
  orion-ui:
    image: ghcr.io/goplasmatic/orion-ui:${ORION_UI_VERSION:-1.6.0}
    depends_on:
      orion:
        condition: service_healthy
    environment:
      # The image's bundled nginx reverse-proxies every /api/ request here: the in-network
      # address of the server, not a browser-reachable one.
      ORION_URL: http://orion:8080
    # Container listens on 8080; 8081 on the host to stay clear of orion.
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  web:
    build:
      context: ../web
    depends_on:
      orion:
        condition: service_healthy
    # 5173 to match `npm run dev`, so one OAuth App serves both.
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

  # --------------------------------------------------------------------------- the parts that are not Orion
  #
  # Axon: the Model Loader. One binary, two roles (layer 04 §8). This is the REPLICA role -- it
  # fetches by hash, serves /play, and its fetch allowlist is empty whatever the environment says,
  # so a compromised workflow cannot tell it where to pull bytes from. It is not an Orion package
  # and has no channels: Kalam reaches it over plain HTTP through the `model-loader` connector, at
  # max_retries: 0, because a retried /play replays a turn.
  axon:
    build:
      context: ../axon
    environment:
      AXON_MODE: replica
      AXON_BIND: 0.0.0.0:9090
      AXON_STORE_DIR: /var/lib/axon
      # A Micro-class model is ~30 KB; the budget is what stops a wave of `large` entries from
      # taking the node down. Small here because the local stack has a handful of models in it.
      AXON_MEMORY_BUDGET_BYTES: ${AXON_MEMORY_BUDGET_BYTES:-1073741824}
      AXON_IDLE_TTL_S: ${AXON_IDLE_TTL_S:-900}
    volumes:
      # The store, by hash. Layer 07 replaces the directory with R2 through the same trait, at
      # which point this is a cache rather than the record. scripts/seed-baselines.sh writes the
      # baselines' bytes straight into it.
      - axon-store:/var/lib/axon
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"

  # The SECOND role of the same binary: admission (layer 04 §8, layer 08). It differs from the
  # replica in four ways and no others -- it accepts URLs and fetches from allowlisted hosts, it
  # mirrors what it verified into the store inside the /load call, it serves /inspect and
  # /validate, and it refuses /play with a 404 so a confusion of roles is loud. It mounts the SAME
  # store as the replica: see the note at the top of the file.
  axon-admission:
    build:
      context: ../axon
    environment:
      AXON_MODE: admission
      AXON_BIND: 0.0.0.0:9090
      AXON_STORE_DIR: /var/lib/axon
      # Only this instance may reach the public internet, and only these two hosts. A release
      # download URL on github.com redirects to objects.githubusercontent.com, so both are needed.
      AXON_FETCH_ALLOW_HOSTS: ${AXON_FETCH_ALLOW_HOSTS:-github.com,objects.githubusercontent.com}
      # Bigger than the replica's: admission holds up to admit_batch models at once, and a Large
      # entry is 64 MiB compressed. A refusal here is a loader fault and a wasted attempt.
      AXON_MEMORY_BUDGET_BYTES: ${AXON_ADMISSION_MEMORY_BYTES:-2147483648}
      # Nothing plays here, so a model need not linger; the clock unloads explicitly anyway.
      AXON_IDLE_TTL_S: ${AXON_ADMISSION_IDLE_TTL_S:-120}
    volumes:
      - axon-store:/var/lib/axon
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"

  # MinIO: the replay object store, S3-compatible, so the presigned PUT the wave does at every
  # finish is exercised against a real implementation rather than a placeholder. Not decoration --
  # a `finished` row REQUIRES replay_key, so a wave that cannot write a blob cannot finish a match.
  # The bucket is made by the loader.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY:-tinybrains}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_KEY:-tinybrains-dev-secret}
    volumes:
      - blob-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

volumes:
  db-data:
  axon-store:
  blob-data:
