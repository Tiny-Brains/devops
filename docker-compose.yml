# TinyBrains local stack. Two Orion units, a one-shot loader that installs into both, and the
# processes that are not Orion. docs/deployment.md §2 is the topology.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose up --build -d                  # one replica -> http://localhost:5173
#   docker compose --profile fleet up --build -d  # two, for the failure walks
#   docker compose run --rm loader                # after editing soma/jodi/kalam
#
# Three invariants this file exists to hold:
#
#   soma is in CLUSTER MODE, kalam replicas are NOT (decision 41). An Orion singleton is a row in
#   the state database, so two somas over one orion_state are one scheduler, while N replicas over
#   one shared state make `wave` fleet-wide -- exactly one replica ever plays and the other N-1
#   poll a held row looking perfectly healthy.
#
#   BOTH AXON ROLES SHARE ONE STORE. Admission mirrors what it verified under the bytes' hash and
#   replicas fetch by that hash; two stores means admission succeeds and every match the version is
#   paired for fails at the residency barrier, quietly. Locally one bucket; across hosts, R2.
#
#   THE ENGINE DIGEST IS DERIVED, NEVER TYPED. The plugin Orion loads, the `[vars] engine_digest`
#   the claim filters on, and `games.active_engine_digest` must agree; a mismatch is not an error
#   anywhere -- the wave just claims nothing, for ever. Each entrypoint and the loader derive it
#   from kalam/plugins/tb-ants/tb-ants.wasm.

name: tinybrains

# ---------------------------------------------------------------------------- shared fragments

x-trust: &trust
  TB_TRUST_PUBLIC_KEY: ${TB_TRUST_PUBLIC_KEY:?run scripts/setup/trust-keygen.sh}
  ORION_ADMIN_KEY: ${ORION_ADMIN_KEY:?run scripts/setup/admin-key.sh}

x-replay-store: &replay-store
  R2_ENDPOINT: ${R2_ENDPOINT:-http://minio:9000}
  R2_BUCKET: ${R2_BUCKET:-tinybrains-replays}
  R2_ACCESS_KEY: ${R2_ACCESS_KEY:-tinybrains}
  R2_SECRET_KEY: ${R2_SECRET_KEY:-tinybrains-dev-secret}

# The model store both axon roles mount. See the header.
x-model-store: &model-store
  AXON_STORE_S3_ENDPOINT: ${R2_ENDPOINT:-http://minio:9000}
  AXON_STORE_S3_BUCKET: ${AXON_STORE_BUCKET:-tinybrains-models}
  AXON_STORE_S3_REGION: ${R2_REGION:-us-east-1}
  AXON_STORE_S3_ACCESS_KEY: ${R2_ACCESS_KEY:-tinybrains}
  AXON_STORE_S3_SECRET_KEY: ${R2_SECRET_KEY:-tinybrains-dev-secret}

# A replica is disposable: Orion state is a SQLite file with no volume behind it, holding the
# loaded package and nothing else. A crash costs one wave, replayed by the next claim.
x-kalam: &kalam
  build:
    context: ./compose/orion
    args:
      ORION_VERSION: ${ORION_VERSION:-1.7.0}
  volumes:
    - ./compose/orion/kalam.toml.tmpl:/etc/orion/kalam.toml.tmpl:ro
    # Only for the engine digest, derived at boot -- from the package volume, so a replica and the
    # loader cannot be looking at two different components.
    - kalam-pkg:/pkg/kalam:ro
  depends_on:
    kalam-artifacts:
      condition: service_completed_successfully
    db:
      condition: service_healthy
  # drain is a fixed sleep and buys a routeless cron-only node nothing; force is the real outer
  # bound on a draining wave. stop_grace_period must exceed drain + force, or compose SIGKILLs the
  # drain and leaves rows `running` with a live lease and no error anywhere.
  stop_grace_period: ${KALAM_STOP_GRACE:-2760s}
  restart: unless-stopped

x-kalam-env: &kalam-env
  <<: [*trust, *replay-store]
  ORION_CONFIG_TEMPLATE: /etc/orion/kalam.toml.tmpl
  KALAM_DB_URL: postgres://kalam:${KALAM_DB_PASSWORD:-kalam-dev-secret}@db:5432/${POSTGRES_DB:-soma}
  ORION_SHUTDOWN_DRAIN_SECS: ${KALAM_SHUTDOWN_DRAIN_SECS:-5}
  ORION_SHUTDOWN_FORCE_SECS: ${KALAM_SHUTDOWN_FORCE_SECS:-2700}
  ORION_CRON_SHUTDOWN_SECS: ${KALAM_CRON_SHUTDOWN_SECS:-2700}

# One axon per replica, sharing the replica's network namespace, so the wave reaches it at
# 127.0.0.1:9090 -- the committed default in kalam/connectors/model-loader.json, and the deployed
# sidecar topology. The cost is that this container publishes no ports of its own.
x-axon: &axon
  build:
    context: ../axon
  restart: unless-stopped

x-axon-env: &axon-env
  <<: *model-store
  AXON_MODE: replica
  AXON_BIND: 127.0.0.1:9090
  # Must exceed wave_k x seats x max_class_bytes. Small here because the local stack holds a
  # handful of Micro models; raise it, or lower wave_k, before a real class mix arrives.
  AXON_MEMORY_BUDGET_BYTES: ${AXON_MEMORY_BUDGET_BYTES:-1073741824}
  AXON_IDLE_TTL_S: ${AXON_IDLE_TTL_S:-900}

# ---------------------------------------------------------------------------- services

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-soma}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Once only, on first initialisation of the volume, in filename order. Re-running them means
      # `docker compose down -v`; everything after that is the loader's, and idempotent.
      - ./compose/db-init/10-orion-state.sh:/docker-entrypoint-initdb.d/10-orion-state.sh:ro
      - ../soma/migrations/0001_init.sql:/docker-entrypoint-initdb.d/20-soma-schema.sql:ro
      - ../soma/migrations/0002_sessions.sql:/docker-entrypoint-initdb.d/25-soma-sessions.sql:ro
      - ./compose/db-init/30-seed.sql:/docker-entrypoint-initdb.d/30-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soma} -d ${POSTGRES_DB:-soma}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Cluster mode refuses to start without one. Dedup windows, response caches and per-channel rate
  # limits live here, so Soma's limits are fleet-wide numbers rather than per-node ones.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  # orion-server and nothing else: packages are installed by `loader`, the config is mounted.
  # Cluster mode is on with one replica deliberately -- a stack that only turns it on in production
  # has never tested it.
  soma:
    build:
      context: ./compose/orion
      args:
        ORION_VERSION: ${ORION_VERSION:-1.7.0}
    volumes:
      - ./compose/orion/soma.toml.tmpl:/etc/orion/soma.toml.tmpl:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *trust
      ORION_CONFIG_TEMPLATE: /etc/orion/soma.toml.tmpl
      ORION_STATE_DB_URL: postgres://${POSTGRES_USER:-soma}:${POSTGRES_PASSWORD}@db:5432/orion_state
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      SOMA_DB_URL: postgres://${POSTGRES_USER:-soma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-soma}
      # Jodi's own role, not the schema owner: no DELETE anywhere, nothing at all on `sessions`.
      JODI_DB_URL: postgres://jodi:${JODI_DB_PASSWORD:-jodi-dev-secret}@db:5432/${POSTGRES_DB:-soma}

      # HS256 for session tokens and the sign-in state cookie. Rotating it invalidates every live
      # session and every sign-in in flight. At least 32 bytes.
      SOMA_SESSION_SECRET: ${SOMA_SESSION_SECRET:?set SOMA_SESSION_SECRET in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}

      # Must match the OAuth App's callback exactly, and must be an address the BROWSER can reach.
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:5173/v1/auth/github/callback}
      APP_URL: ${APP_URL:-http://localhost:5173/}

      # DEVELOPMENT ONLY: browsers will not store a Secure cookie from an http:// origin, which
      # breaks sign-in in a way that looks like nothing happened. Set to 1 once behind TLS.
      SOMA_COOKIE_SECURE: "${SOMA_COOKIE_SECURE:-0}"

      RELEASE_BASE: ${RELEASE_BASE:-https://github.com/}
      # orion-server substitutes this from THIS container's environment, so a value only in .env
      # never reaches it and the gap stays 1 whatever .env says.
      SEASON_GAP_DAYS: ${SEASON_GAP_DAYS:-1}

      # PRESIGNED GET ONLY, and signing makes no network call -- so what Soma needs is not an
      # address it can reach but the address the BROWSER will fetch: SigV4 signs the host, and a URL
      # signed for `minio:9000` is one only a container can use. In a deployment both are the same
      # public R2 endpoint and R2_PUBLIC_ENDPOINT can go unset.
      R2_ENDPOINT: ${R2_PUBLIC_ENDPOINT:-${R2_ENDPOINT:-http://127.0.0.1:9000}}
      R2_BUCKET: ${R2_BUCKET:-tinybrains-replays}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-tinybrains}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-tinybrains-dev-secret}

      ORION_SHUTDOWN_DRAIN_SECS: ${SOMA_SHUTDOWN_DRAIN_SECS:-30}
      ORION_SHUTDOWN_FORCE_SECS: ${SOMA_SHUTDOWN_FORCE_SECS:-30}
      ORION_CRON_SHUTDOWN_SECS: ${SOMA_CRON_SHUTDOWN_SECS:-60}
    stop_grace_period: ${SOMA_STOP_GRACE:-90s}
    restart: unless-stopped
    # Development machines only: the admin plane lives here too.
    ports:
      - "127.0.0.1:8080:8080"

  kalam-1:
    <<: *kalam
    environment:
      <<: *kalam-env
      # Pins the engine instead of deriving it, which is how a rolling deploy is rehearsed: give
      # kalam-2 the new digest and watch this one drain. The loader refuses a pin that disagrees
      # with the vendored file.
      KALAM_ENGINE_DIGEST: ${KALAM_1_ENGINE_DIGEST:-}
    ports:
      # This replica's admin plane. Its axon sidecar is deliberately not published -- the sidecar
      # binds 127.0.0.1 inside this namespace, so only the wave running here can reach it:
      #   docker exec tinybrains-kalam-1-1 curl -s 127.0.0.1:9090/healthz
      - "127.0.0.1:8082:8080"

  kalam-2:
    <<: *kalam
    profiles: ["fleet"]
    environment:
      <<: *kalam-env
      KALAM_ENGINE_DIGEST: ${KALAM_2_ENGINE_DIGEST:-}
    ports:
      - "127.0.0.1:8083:8080"

  # The replica role: fetches by hash, serves /play, and its fetch allowlist is empty whatever the
  # environment says. Not an Orion package and has no channels -- the wave reaches it over plain
  # HTTP at max_retries: 0, because a retried /play replays a turn.
  axon-1:
    <<: *axon
    network_mode: "service:kalam-1"
    depends_on: [kalam-1]
    environment:
      <<: *axon-env

  axon-2:
    <<: *axon
    profiles: ["fleet"]
    network_mode: "service:kalam-2"
    depends_on: [kalam-2]
    environment:
      <<: *axon-env

  # The same binary's second role. It differs from a replica in four ways and no others: it accepts
  # URLs from allowlisted hosts, mirrors what it verified into the store inside /load, serves
  # /inspect and /validate, and refuses /play with a 404 so a confusion of roles is loud.
  axon-admission:
    <<: *axon
    environment:
      <<: *model-store
      AXON_MODE: admission
      AXON_BIND: 0.0.0.0:9090
      # The only instance that may reach the internet, and only these two hosts: a github.com
      # release URL redirects to objects.githubusercontent.com, so both are needed.
      AXON_FETCH_ALLOW_HOSTS: ${AXON_FETCH_ALLOW_HOSTS:-github.com,objects.githubusercontent.com}
      # Bigger than a replica's: admission holds up to admit_batch models at once.
      AXON_MEMORY_BUDGET_BYTES: ${AXON_ADMISSION_MEMORY_BYTES:-2147483648}
      AXON_IDLE_TTL_S: ${AXON_ADMISSION_IDLE_TTL_S:-120}
    ports:
      - "127.0.0.1:9091:9090"

  # One-shot: puts the cartridge's build output where everything else reads it.
  #
  # THIS REPLACES A SIBLING CHECKOUT. ants/ used to commit tb-ants.wasm and the manifests beside it,
  # and every consumer read them out of ../ants -- which made "all ten repositories cloned into one
  # directory" the only layout this file works in. The artifacts now come from the image that
  # builds them, so the coordinate is a tag rather than a path:
  #
  #   ANTS_REF=tinybrains/ants:dev            built here from ANTS_DIR (the default)
  #   ANTS_REF=ghcr.io/tiny-brains/ants:v1    pulled, pinned, no checkout at all
  #
  # THE DIGEST FOLLOWS THE IMAGE. Whatever this produces is what kalam loads, what pair stamps on
  # every row, and what the viewer re-simulates with -- so a rebuild that changes the component is
  # a rules change, and `ENGINE_RELEASE=1` is the gate that refuses one while a season is live.
  ants-artifacts:
    build:
      context: ${ANTS_DIR:-../ants}
    image: ${ANTS_REF:-tinybrains/ants:dev}
    # The image's own CMD copies /artifacts into /out and exits; everything that needs the
    # cartridge waits on that exit rather than on a health check.
    volumes:
      - ants-pkg:/out

  # One-shot: puts Kalam's package -- and with it the engine every replica plays -- where the
  # loader and the replicas read it.
  #
  # THE CARTRIDGE IS NOT COPIED INTO KALAM ANY MORE. There used to be two committed copies of one
  # component, ants' and the one vendor-engine.sh left in kalam, and nothing errored when they
  # drifted: the ladder played a component ants does not ship, with a viewer built against the
  # other. kalam's image takes the component straight from the cartridge's image, so ANTS_REF alone
  # decides which engine runs -- and a deployment should pin it rather than build `:dev`, because a
  # digest that moves under a live season is a queue that stops being claimed.
  kalam-artifacts:
    build:
      context: ${KALAM_DIR:-../kalam}
      args:
        ANTS_REF: ${ANTS_REF:-tinybrains/ants:dev}
    image: ${KALAM_REF:-tinybrains/kalam:dev}
    depends_on:
      ants-artifacts:
        condition: service_completed_successfully
    volumes:
      - kalam-pkg:/out

  # One-shot: puts Jodi's package where the loader reads it.
  #
  # Jodi ships no server -- it is declarations loaded into an orion-server this repo owns -- but it
  # does ship build output: two wasm plugins, and `channels/` + `workflows/` generated from
  # scripts/gen-jodi.py. None of that is committed any more, so it arrives as an image rather than
  # as a bind-mounted checkout.
  #
  #   JODI_REF=tinybrains/jodi:dev            built here from JODI_DIR (the default)
  #   JODI_REF=ghcr.io/tiny-brains/jodi:v1    pulled, pinned, no checkout at all
  jodi-artifacts:
    build:
      context: ${JODI_DIR:-../jodi}
    image: ${JODI_REF:-tinybrains/jodi:dev}
    volumes:
      - jodi-pkg:/out

  # One-shot: declares the deployment facts, makes the buckets, and installs each package into the
  # server that runs it. soma and jodi go to SOMA_ORION_ADMIN and one call reaches every node of
  # that cluster; kalam goes to each entry of KALAM_ORION_ADMINS in turn, because each replica has
  # its own state database and there is no epoch bus between them.
  loader:
    build:
      context: ./compose/loader
    depends_on:
      ants-artifacts:
        condition: service_completed_successfully
      jodi-artifacts:
        condition: service_completed_successfully
      kalam-artifacts:
        condition: service_completed_successfully
      soma:
        condition: service_healthy
      kalam-1:
        condition: service_healthy
      # A wave whose loader is absent claims matches it cannot play, each costing a lease and two
      # lapses -- so the package is not installed until the axons answer.
      axon-1:
        condition: service_healthy
      axon-admission:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ${SOMA_DIR:-../soma}:/pkg/soma:ro
      - jodi-pkg:/pkg/jodi:ro
      - kalam-pkg:/pkg/kalam:ro
      # The cartridge's build output, from the volume `ants-artifacts` populates -- NOT from a
      # sibling checkout. That is what carries reference/observations.json, so the reference set is
      # now the engine's own rather than axon's one worst-case fixture standing in for it.
      - ants-pkg:/pkg/ants:ro
      - ${AXON_DIR:-../axon}/tests/fixtures/ants-observation.json:/pkg/reference/ants-observation.json:ro
      # Plugin signatures. NOT part of any package: a signature belongs to whoever holds the trust
      # key, and a package that ships as an image several deployments share cannot carry one. Each
      # load-package.sh reads PLUGIN_SIG_DIR; scripts/setup/sign-plugins.sh fills this directory.
      - ./keys/signatures:/sig:ro
      # The deploy steps that are not `loader` itself, mounted rather than baked in:
      #   docker compose run --rm --no-deps --entrypoint /deploy/declare-engine.sh loader
      - ./scripts/deploy:/deploy:ro
    environment:
      <<: *replay-store
      # For `--profile fleet`, add kalam-2 here or in .env:
      #   KALAM_ORION_ADMINS=http://kalam-1:8080/api/v1/admin,http://kalam-2:8080/api/v1/admin
      SOMA_ORION_ADMIN: ${SOMA_ORION_ADMIN:-http://soma:8080/api/v1/admin}
      KALAM_ORION_ADMINS: ${KALAM_ORION_ADMINS:-http://kalam-1:8080/api/v1/admin}
      # 1 declares the vendored engine as a rules change, refused while a season is live.
      ENGINE_RELEASE: ${ENGINE_RELEASE:-0}
      LOADER_DB_URL: postgres://${POSTGRES_USER:-soma}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-soma}
      KALAM_DB_PASSWORD: ${KALAM_DB_PASSWORD:-kalam-dev-secret}
      JODI_DB_PASSWORD: ${JODI_DB_PASSWORD:-jodi-dev-secret}
      ORION_ADMIN_API_KEY: ${ORION_ADMIN_KEY:?run scripts/setup/admin-key.sh}
      KALAM_ENGINE_DIGEST: ${KALAM_ENGINE_DIGEST:-}
      # Compose service names resolve to private addresses, which Orion's SSRF guard refuses unless
      # the connector opts in; the committed packages do not ship with the guard disabled.
      SOMA_ALLOW_PRIVATE_DB: "1"
      JODI_ALLOW_PRIVATE_DB: "1"
      KALAM_ALLOW_PRIVATE_URLS: "1"
      ADMISSION_LOADER_URL: http://axon-admission:9090
      PLUGIN_SIG_DIR: /sig
      # MODEL_LOADER_URL is deliberately unset: axon is a sidecar in each replica's namespace, so
      # the connector's committed default is already right on every replica.
    restart: "no"

  # Orion's operations console: dashboards, the channel/connector map, workflow DAGs, traces. It
  # reads the same admin API the loader writes to. Published on 127.0.0.1 only -- anyone who can
  # reach it can create, edit and delete channels and workflows.
  orion-ui:
    image: ghcr.io/goplasmatic/orion-ui:${ORION_UI_VERSION:-1.6.0}
    depends_on:
      soma:
        condition: service_healthy
    environment:
      # The in-network address, for the image's bundled nginx. A Kalam replica's admin plane is on
      # 127.0.0.1:8082 (and :8083) directly.
      ORION_URL: http://soma:8080
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  web:
    build:
      context: ${WEB_DIR:-../web}
      args:
        # The replay viewer, taken from the cartridge's own image rather than from a checkout beside
        # web/. The SAME ref the ladder plays, so the viewer re-simulates with the component that
        # recorded the match -- a viewer built against a different engine draws a plausible match
        # that never happened, and nothing errors.
        ANTS_REF: ${ANTS_REF:-tinybrains/ants:dev}
    volumes:
      # The book, rendered. A separate repository that web/'s build context cannot reach, so
      # locally it is mounted and a deployment bakes it in at the same path. Run `mdbook build` in
      # docs/ first; without it /docs answers 404 and nothing else is affected.
      - ${DOCS_DIR:-../docs}/book:/usr/share/nginx/html/docs:ro
    depends_on:
      soma:
        condition: service_healthy
    # 5173 to match `npm run dev`, so one OAuth App serves both.
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

  # The replay object store, so the presigned PUT the wave does at every finish runs against a real
  # S3 implementation. A `finished` row requires replay_key, so a wave that cannot write a blob
  # cannot finish a match. The buckets are made by the loader.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY:-tinybrains}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_KEY:-tinybrains-dev-secret}
    volumes:
      - blob-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

volumes:
  db-data:
  blob-data:
  # The cartridge's build output. Populated by `ants-artifacts` on every `up`, never by a checkout.
  ants-pkg:
  # Jodi's package: clocks, workflows, connectors, plugins. Populated by `jodi-artifacts`.
  jodi-pkg:
  # Kalam's package, including the engine component every replica derives its digest from.
  kalam-pkg:
