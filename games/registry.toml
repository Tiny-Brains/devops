# The games this CLI can play, and where their artifacts come from -- the same four things
# compose/loader/run.sh writes onto the `games` row, in a form that needs no database and no
# network. So a competitor resolves a game offline, against THE SAME digest string the ladder pins.
#
#   path      a sibling checkout. The digest is whatever the file hashes to, and is REPORTED rather
#             than pinned: it changes on every build, so pinning it could only ever be wrong.
#   release   published artifacts, cached under ~/.cache/tinybrains/cartridges/<digest>/. PINNED:
#             a file that does not hash to what is declared here is refused, not used.
#
# Adding a game is an entry here and no Rust at all.

[games.ants]
name = "Ants"
# The sibling checkout the compose file already assumes.
path = "../../ants"

# Once a release is cut, swap `path` for these. `tinybrains games` reports which way it resolved.
#
# repo      = "Tiny-Brains/ants"
# release   = "v1.0.0"
# component = { file = "tb-ants.wasm",   sha256 = "sha256:..." }   # == engine_digest
# manifest  = { file = "cartridge.json", sha256 = "sha256:..." }   # carries the board catalogue
